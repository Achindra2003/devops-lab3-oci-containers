name: ContainerPulse OCI Build, Vulnerability Scan & Registry Push

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # Job 1: Dockerfile Linting & CIS Benchmark Audit
  # -------------------------------------------------------------
  lint-and-audit:
    name: CIS Benchmark & Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Dockerfile Security & Benchmark Audit
        run: |
          echo "🔍 Auditing Dockerfile against CIS Docker Benchmarks..."
          node scripts/scan-vulnerabilities.js

      - name: Verify .dockerignore Integrity
        run: |
          test -f .dockerignore || (echo "Missing .dockerignore" && exit 1)
          grep -q "node_modules" .dockerignore || (echo "node_modules not ignored" && exit 1)
          grep -q ".git" .dockerignore || (echo ".git not ignored" && exit 1)
          echo "✔ .dockerignore hygiene verified."

  # -------------------------------------------------------------
  # Job 2: Unit Testing & Local Container Build
  # -------------------------------------------------------------
  build-and-test:
    name: Unit Tests & Container Build
    needs: lint-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Run Automated Unit Tests
        run: npm test

      - name: Build Optimized OCI Container Image
        run: |
          echo "🐳 Building optimized multi-stage OCI image..."
          docker build \
            --tag containerpulse:local-test \
            --tag containerpulse:1.0.0 \
            --file Dockerfile .

      - name: Verify Non-Root User & Container Liveness
        run: |
          echo "🚀 Testing container execution in detached mode..."
          docker run -d -p 3000:3000 --name test-container containerpulse:local-test
          sleep 3
          
          echo "Checking whoami inside container:"
          USER_NAME=$(docker exec test-container whoami)
          echo "Container running as user: $USER_NAME"
          if [ "$USER_NAME" = "root" ]; then
            echo "❌ ERROR: Container is running as root!"
            exit 1
          fi
          
          echo "Testing /healthz endpoint:"
          curl -f http://localhost:3000/healthz || (echo "Healthcheck failed" && exit 1)
          docker stop test-container && docker rm test-container

  # -------------------------------------------------------------
  # Job 3: Vulnerability Scanning with Trivy & Docker Scout
  # (Self-Learning Initiative: Automated Container CVE Auditing)
  # -------------------------------------------------------------
  vulnerability-scan:
    name: Trivy & Docker Scout Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Image for Scanning
        run: docker build -t containerpulse:${{ github.sha }} .

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'containerpulse:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'containerpulse:${{ github.sha }}'
          format: 'cyclonedx'
          output: 'containerpulse-sbom.json'

      - name: Upload SBOM Security Artifact
        uses: actions/upload-artifact@v4
        with:
          name: containerpulse-sbom
          path: containerpulse-sbom.json
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Multi-Arch Buildx & Registry Push
  # (Self-Learning Initiative: Multi-Architecture OCI Compilation)
  # -------------------------------------------------------------
  multi-arch-push:
    name: Multi-Arch Build & GHCR Push
    needs: vulnerability-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Multi-Arch Image (amd64 / arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
